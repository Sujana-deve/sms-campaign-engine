{% extends 'campaigns/base.html' %}

{% block title %}New Campaign — SMS Campaign Manager{% endblock %}

{% block content %}
<div style="max-width:640px;">
    <h2 style="font-size:24px; font-weight:600; margin-bottom:24px;">New Campaign</h2>

    <div class="card">
        <form method="post">
            {% csrf_token %}

            <div style="margin-bottom:20px;">
                <label style="display:block; font-size:14px; font-weight:500; margin-bottom:6px;">Campaign Name</label>
                <input type="text" name="name" required placeholder="e.g. Kathmandu Restaurants May 2026"
                    style="width:100%; padding:10px 14px; border:1px solid #e2e8f0; border-radius:6px; font-size:14px;">
            </div>

            <div style="margin-bottom:20px;">
                <label style="display:block; font-size:14px; font-weight:500; margin-bottom:6px;">Message Template</label>
                <textarea name="template" required rows="4" placeholder="Hello {owner_name}, this is a special offer for {business_name} in {city}!"
                    style="width:100%; padding:10px 14px; border:1px solid #e2e8f0; border-radius:6px; font-size:14px; resize:vertical;"></textarea>
                <p style="font-size:12px; color:#718096; margin-top:4px;">Use {owner_name}, {business_name}, {city} for personalization. Keep under 160 characters.</p>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px;">
                <div>
                    <label style="display:block; font-size:14px; font-weight:500; margin-bottom:6px;">Filter by City <span style="color:#718096;">(optional)</span></label>
                    <select name="city" style="width:100%; padding:10px 14px; border:1px solid #e2e8f0; border-radius:6px; font-size:14px;">
                        <option value="">All Cities</option>
                        {% for city in cities %}
                        <option value="{{ city }}">{{ city }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
    <label style="display:block; font-size:14px; font-weight:500; margin-bottom:6px;">Filter by Category <span style="color:#718096;">(optional)</span></label>
    <select name="category" style="width:100%; padding:10px 14px; border:1px solid #e2e8f0; border-radius:6px; font-size:14px;">
        <option value="">All Categories</option>
        {% for category in categories %}
        <option value="{{ category }}">{{ category }}</option>
        {% endfor %}
    </select>
</div>
            </div>

            <div style="display:flex; gap:12px;">
                <button type="submit" class="btn btn-primary">🚀 Launch Campaign</button>
                <a href="/" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
