{% extends 'campaigns/base.html' %}

{% block title %}New Campaign — SMS Campaign Manager{% endblock %}

{% block content %}
<div class="form-narrow">
    <div class="page-header">
        <h2 class="page-title">New Campaign</h2>
    </div>

    <div class="card">
        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">Campaign Name</label>
                <input type="text" name="name" required placeholder="e.g. Kathmandu Restaurants May 2026" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label">Message Template</label>

                <!-- Insert Field Buttons -->
                <div class="field-chips">
                    <span class="form-hint">Insert field:</span>
                    <button type="button" class="field-chip" onclick="insertField('{owner_name}')">Owner Name</button>
                    <button type="button" class="field-chip" onclick="insertField('{business_name}')">Business Name</button>
                    <button type="button" class="field-chip" onclick="insertField('{city}')">City</button>
                </div>

                <textarea id="messageTemplate" name="template" required rows="4" class="form-textarea"
                    placeholder="e.g. Hello {owner_name}, we have a special offer for {business_name} in {city}. Contact us today!"
                    oninput="updateCounter()"></textarea>

                <!-- Character Counter -->
                <div style="display:flex; justify-content:space-between; margin-top:6px;">
                    <p class="form-hint">Click a field button above to insert it at cursor position.</p>
                    <p id="charCounter" class="form-hint">0 / 160</p>
                </div>

                <!-- Message Preview -->
                <div id="previewBox" style="margin-top:14px; padding:12px; border:1px solid #e2e5ea; border-radius:8px; background:#f8f9fb; display:none;">
                    <p class="form-hint" style="margin-bottom:6px;">Preview:</p>
                    <p id="previewText" style="margin:0; white-space:pre-wrap;"></p>
                    <p id="previewMeta" class="form-hint" style="margin-top:8px; margin-bottom:0;"></p>
                </div>
            </div>

            <div class="form-row" style="margin-bottom:24px;">
                <div>
                    <label class="form-label">Filter by City <span class="optional">(optional)</span></label>
                    <select name="city" id="filterCity" class="form-select" onchange="updatePreview()">
                        <option value="">All Cities</option>
                        {% for city in cities %}
                        <option value="{{ city }}">{{ city }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="form-label">Filter by Category <span class="optional">(optional)</span></label>
                    <select name="category" id="filterCategory" class="form-select" onchange="updatePreview()">
                        <option value="">All Categories</option>
                        {% for category in categories %}
                        <option value="{{ category }}">{{ category }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">🚀 Launch Campaign</button>
                <a href="/" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
    function insertField(field) {
        const textarea = document.getElementById('messageTemplate');
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const text = textarea.value;

        textarea.value = text.substring(0, start) + field + text.substring(end);

        textarea.selectionStart = start + field.length;
        textarea.selectionEnd = start + field.length;
        textarea.focus();

        updateCounter();
    }

    function updateCounter() {
        const textarea = document.getElementById('messageTemplate');
        const len = textarea.value.length;
        const counter = document.getElementById('charCounter');
        counter.textContent = len + ' / 160';

        if (len > 160) {
            counter.style.color = '#c0362c';
        } else if (len > 140) {
            counter.style.color = '#b7791f';
        } else {
            counter.style.color = '#8a93a6';
        }

        updatePreview();
    }

    let previewDebounce;
    function updatePreview() {
        clearTimeout(previewDebounce);
        previewDebounce = setTimeout(fetchPreview, 400);
    }

    function getCookie(name) {
        const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
        return match ? match[2] : null;
    }

    function fetchPreview() {
        const template = document.getElementById('messageTemplate').value;
        const previewBox = document.getElementById('previewBox');
        const previewText = document.getElementById('previewText');
        const previewMeta = document.getElementById('previewMeta');

        if (!template.trim()) {
            previewBox.style.display = 'none';
            return;
        }

        const city = document.getElementById('filterCity').value;
        const category = document.getElementById('filterCategory').value;

        const params = new URLSearchParams();
        params.append('template', template);
        params.append('city', city);
        params.append('category', category);

        fetch('{% url "preview_message" %}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-CSRFToken': getCookie('csrftoken'),
            },
            body: params.toString(),
        })
        .then(res => res.json())
        .then(data => {
            previewBox.style.display = 'block';
            if (data.error) {
                previewText.textContent = data.error;
                previewText.style.color = '#c0362c';
                previewMeta.textContent = '';
                return;
            }
            previewText.textContent = data.rendered;
            previewText.style.color = '#1a1a1a';
            previewMeta.textContent = `Sample: ${data.contact_used} — ${data.length} chars` +
                (data.over_limit ? ' (over 160, will split into multiple SMS)' : '');
        })
        .catch(() => {
            previewBox.style.display = 'none';
        });
    }
</script>

{% endblock %}
