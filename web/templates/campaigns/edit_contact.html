{% extends 'campaigns/base.html' %}

{% block title %}Edit Contact — SMS Campaign Manager{% endblock %}

{% block content %}
<div class="form-narrow">
    <div class="page-header">
        <h2 class="page-title">Edit Contact</h2>
    </div>

    <div class="card">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Business Name <span class="required">*</span></label>
                <input type="text" name="business_name" value="{{ contact.business_name }}" required class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Owner Name</label>
                <input type="text" name="owner_name" value="{{ contact.owner_name|default:'' }}" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Phone <span class="required">*</span></label>
                <input type="text" name="phone" value="{{ contact.phone }}" required class="form-input">
            </div>
            <div class="form-row form-group">
                <div>
                    <label class="form-label">City</label>
                    <input type="text" name="city" value="{{ contact.city|default:'' }}" class="form-input">
                </div>
                <div>
                    <label class="form-label">Category</label>
                    <input type="text" name="category" value="{{ contact.category|default:'' }}" class="form-input">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" value="{{ contact.email|default:'' }}" class="form-input">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{% url 'contact_list' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
